<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PowerPins — plant monitor</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; background: #111; color: #eee;
         max-width: 480px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.3rem; margin: 8px 0 16px; }
  .card { background: #1c1c1e; border-radius: 14px; padding: 16px; margin-bottom: 12px; }
  .moisture { font-size: 3.5rem; font-weight: 700; line-height: 1; }
  .bar { height: 10px; border-radius: 5px; background: #333; margin-top: 12px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 5px; transition: width .5s; }
  .row { display: flex; align-items: center; gap: 8px; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #444; }
  .dot.on { background: #4cd964; }
  .warn { background: #4d2b2b; border: 1px solid #a00; display: none; }
  .meta { color: #888; font-size: .8rem; }
  label { display: block; font-size: .8rem; color: #aaa; margin: 8px 0 2px; }
  input { width: 100%; padding: 8px; border-radius: 8px; border: 1px solid #444;
          background: #2a2a2c; color: #eee; }
  button { margin-top: 12px; padding: 10px 16px; border: 0; border-radius: 8px;
           background: #0a84ff; color: #fff; font-weight: 600; width: 100%; }
  #err { color: #ff6b6b; font-size: .85rem; margin-top: 8px; white-space: pre-wrap; }
</style>
</head>
<body>
<h1>🌱 PowerPins</h1>

<details id="settings">
  <summary class="meta">Settings</summary>
  <div class="card">
    <label>Server URL</label>
    <input id="server" placeholder="http://your-vps-ip:8080">
    <label>API key</label>
    <input id="token" placeholder="same as API_KEY on the server">
    <button id="save">Save &amp; connect</button>
    <div id="err"></div>
  </div>
</details>

<div class="card">
  <div class="meta">Soil moisture</div>
  <div class="moisture"><span id="m">—</span>%</div>
  <div class="bar"><i id="mbar" style="width:0"></i></div>
</div>

<div class="card row">
  <span class="dot" id="pump"></span>
  <span id="pumptext">Pump: —</span>
</div>

<div class="card warn" id="warn">
  ⚠️ <span id="warntext"></span>
</div>

<div class="card meta">
  <div>Device: <span id="online">—</span></div>
  <div>Last update: <span id="ts">never</span></div>
</div>

<script>
const $ = id => document.getElementById(id);
const cfg = JSON.parse(localStorage.getItem('powerpins') || '{}');
$('server').value = cfg.server || 'blynk.cloud';
$('token').value  = cfg.token  || '';
if (cfg.token) $('settings').open = false;

let timer = null;

$('save').onclick = () => {
  cfg.server = $('server').value.trim().replace(/\/+$/, '');
  cfg.token  = $('token').value.trim();
  localStorage.setItem('powerpins', JSON.stringify(cfg));
  start();
};

async function poll() {
  $('err').textContent = '';
  try {
    const base = cfg.server || '';          // empty = same host as the page
    const r = await fetch(`${base}/api/state`, {
      headers: { Authorization: `Bearer ${cfg.token}` },
    });
    if (!r.ok) throw new Error(`${r.status} ${await r.text()}`);
    const d = await r.json();

    const m = typeof d.moisture === 'number' ? d.moisture : null;
    if (m !== null) {
      $('m').textContent = m.toFixed(1);
      const bar = $('mbar');
      bar.style.width = m + '%';
      bar.style.background = m < 30 ? '#ff453a' : m < 60 ? '#ffd60a' : '#4cd964';
    }

    const on = !!d.pumpOn;
    $('pump').classList.toggle('on', on);
    $('pumptext').textContent = 'Pump: ' + (on ? 'watering 💧' : 'idle');

    const w = (d.warning || '').toString();
    $('warn').style.display = w ? 'block' : 'none';
    $('warntext').textContent = w;

    $('ts').textContent = d.lastEventAt
      ? new Date(d.lastEventAt).toLocaleTimeString() : 'never';

    // device counts as online if it reported in the last 30 s
    const age = d.lastEventAt ? (Date.now() - Date.parse(d.lastEventAt)) / 1000 : 1e9;
    $('online').textContent = age < 30 ? 'online ✅' : 'offline ❌';
  } catch (e) {
    $('err').textContent = 'Error: ' + e.message +
      '\n(server unreachable or wrong API key?)';
    $('online').textContent = 'unknown';
  }
}

function start() {
  if (!cfg.token) { $('settings').open = true; return; }
  clearInterval(timer);
  poll();
  timer = setInterval(poll, 5000);   // every 5 s; well within Blynk free limits
}
start();
</script>
</body>
</html>
